<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Corona audio regression</title>
<body><button id="run">Run muted audio checks</button><pre id="results" data-status="waiting">Ready.</pre>
<script type="module">
import * as Tone from 'tone';
import { ToneBackend } from '../src/audio.js';
import { MusicPlayer } from '../src/music-player.js';
import { compileScore } from '../src/midi-score.js';
const output = document.querySelector('#results'), reports = [];
const check = (value, message) => { if (!value) throw new Error(message); };
const note = (ticks, durationTicks, midi = 69) => ({ ticks, durationTicks, midi, velocity: .8 });
function score(notes, durationTicks = 3840) {
  return compileScore({ header: { ppq: 480, timeSignatures: [{ timeSignature: [4, 4] }] }, durationTicks,
    tracks: [{ instrument: {}, notes }] });
}
function rms(buffer, from, to) {
  const data = buffer.getChannelData(0), start = Math.floor(from * buffer.sampleRate), end = Math.floor(to * buffer.sampleRate);
  let sum = 0;
  for (let i = start; i < end; i++) sum += data[i] ** 2;
  return Math.sqrt(sum / (end - start));
}
async function render(value, seconds, actions) {
  let player, backend;
  const buffer = await Tone.Offline(context => {
    backend = new ToneBackend(value, { context, soundProfile: 'classic' });
    player = new MusicPlayer({ score: value, backend });
    player.setTempo(60); player.play();
    actions(context, player, backend);
  }, seconds, 1, 44100);
  player.dispose();
  check(backend.voices.size === 0 && backend.holdVoices.size === 0, 'Voice banks leaked after dispose');
  return buffer.get();
}
document.querySelector('#run').onclick = async () => {
document.querySelector('#run').disabled = true;
output.dataset.status = 'running';
const liveContext = new Tone.Context({ lookAhead: .05 });
try {
  await liveContext.resume();
  let frozen, held, resumed;
  const chord = await render(score([note(0, 960), note(0, 960, 76)]), 4.2, (context, player) => {
    context.setTimeout(() => { player.enterCorona(); frozen = player.snapshot().tick; player.enterCorona(); }, .731);
    context.setTimeout(() => { held = player.snapshot().tick; }, 1.7);
    context.setTimeout(() => { player.exitCorona(); resumed = player.snapshot().tick; player.exitCorona(); }, 2.5);
  });
  check(frozen > 300 && Math.abs(frozen - held) < .001 && Math.abs(frozen - resumed) < .001, 'Frozen fractional tick changed');
  check(rms(chord, 2.1, 2.4) > .005 && rms(chord, 2.7, 3.1) > .005, 'Chord did not sustain/resume');
  check(rms(chord, 3.95, 4.1) < .00001, 'Resumed note did not release at its remaining duration');
  reports.push({ check: 'chord sustain beyond original note-off, fractional resume and remaining duration', pass: true, frozen, held, resumed });

  const rest = await render(score([note(0, 240), note(1200, 240, 72)]), 5.5, (context, player) => {
    context.setTimeout(() => player.enterCorona(), .731);
    context.setTimeout(() => player.exitCorona(), 3);
  });
  check(rms(rest, 1, 2.9) < .00001, 'A rest created sound or queued future attacks leaked');
  check(rms(rest, 4.9, 5.1) > .001, 'Future note did not resume after a frozen rest');
  reports.push({ check: 'rest holds silently and later notes resume', pass: true });

  // Tone.Offline runs its scheduling clock before rendering: disposing a node
  // during that clock removes its earlier sound too. Measure destructive cleanup
  // on a running graph instead, with the output muted AFTER the analyser.
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  {
    const analyser = new Tone.Analyser({ context: liveContext, type: 'waveform', size: 2048 });
    const silent = new Tone.Gain({ context: liveContext, gain: 0 }).toDestination(); analyser.connect(silent);
    const value = score([note(0, 480)]), backend = new ToneBackend(value, { context: liveContext, destination: analyser });
    const player = new MusicPlayer({ score: value, backend });
    const level = () => { const data = analyser.getValue(); return Math.sqrt(data.reduce((sum, v) => sum + v * v, 0) / data.length); };
    player.setTempo(180); player.play(); await wait(200); player.enterCorona();
    const tick = player.snapshot().tick; await wait(400);
    const loud = level();
    check(player.snapshot().tick === tick && loud > .001, 'Live held note released at original note-off');
    player.setVolume(-24); await wait(150); const soft = level();
    check(soft / loud > .3 && soft / loud < .7, 'Master volume did not control sustained sound');
    player.exitCorona(); await wait(400);
    const releaseTail = level();
    check(releaseTail < .001, `Live resumed note remained active: ${releaseTail}`);
    await wait(250);
    check(level() < .00001, `Live ambience failed to decay: ${level()}`);
    player.dispose(); analyser.dispose(); silent.dispose();
    reports.push({ check: 'live lookahead note-off isolation, hold volume and resumed release', pass: true, loud, soft, releaseTail });
  }
  for (const action of ['pause', 'stop', 'dispose']) {
    const analyser = new Tone.Analyser({ context: liveContext, type: 'waveform', size: 2048 });
    const silent = new Tone.Gain({ context: liveContext, gain: 0 }).toDestination();
    analyser.connect(silent);
    const value = score([note(0, 3840)]), backend = new ToneBackend(value, { context: liveContext, destination: analyser });
    const player = new MusicPlayer({ score: value, backend });
    const level = () => { const data = analyser.getValue(); return Math.sqrt(data.reduce((sum, v) => sum + v * v, 0) / data.length); };
    player.setTempo(60); player.play(); await wait(200); player.enterCorona(); await wait(200);
    const before = level(); player[action](); player.exitCorona(); await wait(150);
    const after = level();
    check(before > .001 && after < .00001, `${action} RMS before=${before}, after=${after}`);
    check(!player.snapshot().coronaActive, `${action} retained Corona`);
    player.dispose();
    check(backend.holdVoices.size === 0 && backend.voices.size === 0, 'Voice bank leak');
    analyser.dispose(); silent.dispose();
    reports.push({ check: `live Corona ${action} silences audio and cannot auto-resume`, pass: true, before, after });
  }

  const boundary = await render(score([note(0, 1920)], 1920), 7, (context, player) => {
    for (const [enter, exit] of [[.001, .2], [3.99, 4.7], [5.2, 5.6]]) {
      context.setTimeout(() => player.enterCorona(), enter);
      context.setTimeout(() => player.exitCorona(), exit);
    }
  });
  check(rms(boundary, 6, 6.5) > .001, 'Loop/rapid holds lost the sustained voice');
  check(rms(boundary, 6, 6.5) < .05, 'Repeated holds accumulated voices');
  reports.push({ check: 'repeated holds around loop boundaries remain bounded', pass: true });
  output.dataset.status = 'passed';
  output.textContent = JSON.stringify({ passed: reports.length, reports }, null, 2);
} catch (error) {
  output.dataset.status = 'failed';
  output.textContent = JSON.stringify({ passed: reports.length, reports, error: error.stack }, null, 2);
} finally { await liveContext.close(); liveContext.dispose(); }
};
</script></body></html>
